<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="STUDY1409 — вход в аккаунт ученика школы №1409: расписание, заявки, сервисы школы.">
  <title>STUDY1409: Вход в аккаунт</title>
  <link rel="icon" href="/static/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>document.documentElement.classList.add('js')</script>
  <style>
    :root {
      --bg-primary: #000000;
      --bg-secondary: rgba(255, 255, 255, 0.08);
      --bg-tertiary: rgba(255, 255, 255, 0.06);
      --bg-hover: rgba(255, 255, 255, 0.12);
      --bg-autofill: #131317;
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.78);
      --text-muted: rgba(255, 255, 255, 0.62);
      --border-color: rgba(255, 255, 255, 0.12);
      --border-light: rgba(255, 255, 255, 0.15);
      --accent: #4446E1;
      --accent-deep: #2E3192;
      --accent-gradient: linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%);
      --danger: #ff6b6b;
      --cloud-1: rgba(68, 70, 225, 0.4);
      --cloud-2: rgba(220, 53, 69, 0.35);
      --cloud-3: rgba(100, 102, 255, 0.3);
      --cloud-4: rgba(255, 80, 100, 0.25);
      --shadow-color: rgba(0, 0, 0, 0.3);
      --focus: #a9b0ff;
      --font: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      --space-1: 6px;
      --space-2: 12px;
      --space-3: 16px;
      --space-4: 32px;
      --radius-xs: 10px;
      --radius-field: 14px;
      --radius-card: 28px;
      --dur-fast: 150ms;
      --dur-normal: 200ms;
      --dur-slow: 250ms;
      --ring-focus: 0 0 0 4px rgba(68, 70, 225, 0.35);
      --ring-danger: 0 0 0 4px rgba(255, 107, 107, 0.28);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      position: relative;
      display: flex;
      justify-content: center;
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.5;
      color: var(--text-primary);
      background: var(--bg-primary);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: -1;
      pointer-events: none;
    }

    body::before {
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background:
        radial-gradient(ellipse 80% 60% at 30% 20%, var(--cloud-1) 0%, transparent 50%),
        radial-gradient(ellipse 60% 50% at 70% 30%, var(--cloud-2) 0%, transparent 50%);
      animation: cloudFloat 20s ease-in-out infinite, cloudFadeIn 1.2s ease-out both;
    }

    body::after {
      top: -30%;
      left: -30%;
      width: 160%;
      height: 160%;
      background:
        radial-gradient(ellipse 50% 40% at 60% 25%, var(--cloud-3) 0%, transparent 45%),
        radial-gradient(ellipse 40% 35% at 40% 35%, var(--cloud-4) 0%, transparent 40%);
      animation: cloudFloat2 25s ease-in-out infinite reverse, cloudFadeIn 1.6s ease-out both;
    }

    @keyframes cloudFadeIn {
      from { opacity: 0; transform: scale(0.85); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes cloudFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(4%, 3%) scale(1.05); }
      50% { transform: translate(-3%, 4%) scale(0.98); }
      75% { transform: translate(-4%, -2%) scale(1.02); }
    }

    @keyframes cloudFloat2 {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      33% { transform: translate(-4%, 4%) rotate(2deg); }
      66% { transform: translate(4%, -3%) rotate(-2deg); }
    }

    :where(a, button, input):focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .page {
      width: 100%;
      max-width: 1180px;
      margin-inline: auto;
      padding: clamp(24px, 3vw, 48px) clamp(16px, 3vw, 32px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-2);
      margin-bottom: clamp(20px, 2.4vw, 32px);
      text-align: center;
    }

    .brand-header img {
      height: 64px;
      filter: drop-shadow(0 4px 15px rgba(0, 0, 0, 0.35));
    }

    .brand-header h1 {
      font-size: clamp(20px, 2vw, 26px);
      font-weight: 800;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.25);
    }

    .brand-header p {
      max-width: 52ch;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .layout {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .login-col {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
    }

    .login-card {
      padding: 30px;
      background: var(--bg-tertiary);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-card);
      box-shadow: 0 20px 50px var(--shadow-color);
    }

    .login-title {
      margin-bottom: 6px;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.3px;
      text-align: center;
    }

    .login-subtitle {
      margin-bottom: 20px;
      font-size: 0.82rem;
      font-weight: 500;
      text-align: center;
      color: var(--text-muted);
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }

    .field { position: relative; display: flex; flex-direction: column; gap: var(--space-1); }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: var(--space-3);
      padding-right: 52px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-field);
      color: var(--text-primary);
      font: inherit;
      font-size: 1rem;
      font-weight: 500;
      transition: background var(--dur-slow) ease, border-color var(--dur-slow) ease, box-shadow var(--dur-slow) ease, opacity var(--dur-normal) ease;
    }

    #login { padding-right: var(--space-3); }

    input::placeholder { color: var(--text-muted); }

    input:hover:not(:disabled):not(:read-only) { background: var(--bg-hover); }

    input:focus {
      outline: none;
      background: var(--bg-hover);
      border-color: var(--accent);
      box-shadow: var(--ring-focus);
    }

    input:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    input:disabled,
    input:read-only:not([type="checkbox"]) {
      opacity: 0.6;
      cursor: default;
    }

    input[aria-invalid="true"] {
      border-color: var(--danger);
      box-shadow: var(--ring-danger);
    }

    input:-webkit-autofill {
      -webkit-text-fill-color: var(--text-primary);
      -webkit-box-shadow: 0 0 0 1000px var(--bg-autofill) inset;
    }

    .field__error {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--danger);
    }

    .reveal-btn {
      position: absolute;
      right: var(--space-1);
      top: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: var(--radius-xs);
      background: none;
      color: var(--text-muted);
      cursor: pointer;
      transition: color var(--dur-fast) ease, background var(--dur-fast) ease, opacity var(--dur-normal) ease;
    }

    .reveal-btn:hover { color: var(--text-primary); background: var(--bg-hover); }
    .reveal-btn:active { background: var(--bg-secondary); }
    .reveal-btn:disabled { opacity: 0.5; cursor: default; background: none; color: var(--text-muted); }
    .reveal-btn svg { width: 20px; height: 20px; }

    .form-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      font-size: 0.82rem;
      font-weight: 600;
    }

    .check {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      color: var(--text-secondary);
      cursor: pointer;
    }

    .check input {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .check input:disabled { cursor: default; }

    .form-row a {
      color: var(--text-secondary);
      text-decoration: none;
      transition: color var(--dur-fast) ease;
    }

    .form-row a:hover { color: var(--text-primary); text-decoration: underline; }
    .form-row a:active { color: var(--text-primary); }

    .submit-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      width: 100%;
      margin-top: var(--space-1);
      padding: var(--space-3);
      border: 0;
      border-radius: var(--radius-field);
      background: var(--accent-gradient);
      color: var(--text-primary);
      font: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform var(--dur-normal) ease, box-shadow var(--dur-normal) ease, opacity var(--dur-normal) ease;
    }

    .submit-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(68, 70, 225, 0.4);
    }

    .submit-btn:active:not(:disabled) { transform: translateY(0); box-shadow: none; }

    .submit-btn:disabled,
    .submit-btn[aria-busy="true"] {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .submit-btn__spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: var(--text-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .submit-btn[aria-busy="true"] .submit-btn__spinner { display: block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .alert {
      min-height: 1.2rem;
      margin-top: 15px;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
      color: var(--danger);
      overflow-wrap: anywhere;
    }

    .support-link {
      display: block;
      margin-top: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
      color: var(--text-muted);
      text-decoration: none;
      transition: color var(--dur-fast) ease;
    }

    .support-link:hover { color: var(--text-primary); }
    .support-link:active { color: var(--text-secondary); }

    .registration-btn {
      display: block;
      margin: 10px auto 0;
      padding: var(--space-1) 2px;
      border: 0;
      background: none;
      font: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: color var(--dur-fast) ease;
    }

    .registration-btn:hover { color: var(--text-secondary); }
    .registration-btn:active { color: var(--text-primary); }
    .registration-btn:disabled { opacity: 0.5; cursor: default; }

    .footer-dit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-2);
      margin-top: clamp(28px, 3.4vw, 48px);
      text-align: center;
    }

    .footer-dit img { height: 30px; }

    .footer-text {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .js .brand-header,
    .js .login-col,
    .js .footer-dit {
      opacity: 0;
      transform: translateY(16px);
    }

    .js.is-ready .brand-header { animation: fadeInUp 0.55s ease-out 0.05s both; }
    .js.is-ready .login-col { animation: fadeInUp 0.55s ease-out 0.15s both; }
    .js.is-ready .footer-dit { animation: fadeInUp 0.55s ease-out 0.38s both; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (min-width: 1080px) {
      .page { padding-inline: 40px; }

      .login-card { padding: 34px; }

      .brand-header img { height: 72px; }
    }

    @media (min-width: 1400px) {
      .login-card { padding: 38px; }

      .brand-header img { height: 84px; }
    }

    @media (min-width: 1080px) and (max-height: 820px) {
      .brand-header { margin-bottom: 20px; }
      .brand-header img { height: 52px; }
      .brand-header p { display: none; }
      .login-card { padding: 26px 30px; }
      .footer-dit { margin-top: 28px; }
    }

    @media (max-width: 640px) {
      .login-card { padding: 24px 20px; }
      .login-title { font-size: 1.2rem; }
    }

    @media (max-width: 360px) {
      .form-row { flex-wrap: wrap; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="brand-header">
      <img src="/static/logo.svg" alt="Школа №1409">
      <h1>STUDY1409</h1>
      <p>Единый аккаунт ученика: расписание, заявки, мероприятия и сервисы школы.</p>
    </header>

    <main class="layout">
      <div class="login-col">
        <div class="login-card">
          <h2 class="login-title">Вход в аккаунт</h2>
          <p class="login-subtitle">Логин и пароль выдаёт классный руководитель</p>

          <form class="login-form" id="login-form" method="post" action="#" novalidate>
            <div class="field">
              <label class="sr-only" for="login">Логин</label>
              <input type="text" id="login" name="login" placeholder="Введите свою почту"
                     autocomplete="username" autocapitalize="off" spellcheck="false"
                     aria-describedby="login-error" required>
              <span class="field__error" id="login-error" role="alert" hidden></span>
            </div>

            <div class="field">
              <label class="sr-only" for="password">Пароль</label>
              <input type="password" id="password" name="password" placeholder="Пароль"
                     autocomplete="current-password" aria-describedby="password-error" required>
              <span class="field__error" id="password-error" role="alert" hidden></span>
              <button class="reveal-btn" id="reveal-btn" type="button"
                      aria-pressed="false" aria-controls="password" aria-label="Показать пароль">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>

            <div class="form-row">
              <label class="check" for="remember">
                <input id="remember" name="remember" type="checkbox" value="1">
                Запомнить меня
              </label>
              <a href="/help">Забыли пароль?</a>
            </div>

            <button class="submit-btn" id="submit-btn" type="submit">
              <span>Войти</span>
              <span class="submit-btn__spinner" aria-hidden="true"></span>
            </button>

            <p class="sr-only" id="submit-status" role="status" aria-live="polite"></p>
          </form>

          <p class="alert" id="form-alert" role="alert" aria-live="assertive"></p>

          <a class="support-link" href="/help">Техподдержка</a>
          <button class="registration-btn" type="button">Как зарегистрироваться?</button>
        </div>
      </div>
    </main>

    <footer class="footer-dit">
      <img src="/static/departament-logo.png" alt="">
      <p class="footer-text">Созданно в школе 1409</p>
    </footer>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const login = document.getElementById('login');
    const password = document.getElementById('password');
    const loginError = document.getElementById('login-error');
    const passwordError = document.getElementById('password-error');
    const formAlert = document.getElementById('form-alert');
    const submitBtn = document.getElementById('submit-btn');
    const revealBtn = document.getElementById('reveal-btn');
    const submitStatus = document.getElementById('submit-status');

    const showError = (input, node, message) => {
      node.textContent = message || '';
      node.hidden = !message;
      input.setAttribute('aria-invalid', message ? 'true' : 'false');
    };

    const clearAlert = () => {
      formAlert.textContent = '';
    };

    const setBusy = busy => {
      submitBtn.setAttribute('aria-busy', String(busy));
      submitBtn.disabled = busy;
      login.readOnly = busy;
      password.readOnly = busy;
      revealBtn.disabled = busy;
      form.setAttribute('aria-busy', String(busy));
      submitStatus.textContent = busy ? 'Выполняется вход…' : '';
    };

    revealBtn.addEventListener('click', () => {
      const revealed = password.type === 'text';
      password.type = revealed ? 'password' : 'text';
      revealBtn.setAttribute('aria-pressed', String(!revealed));
      revealBtn.setAttribute('aria-label', revealed ? 'Показать пароль' : 'Скрыть пароль');
      password.focus({ preventScroll: true });
    });

    login.addEventListener('input', () => {
      showError(login, loginError, '');
      clearAlert();
    });

    password.addEventListener('input', () => {
      showError(password, passwordError, '');
      clearAlert();
    });

    form.addEventListener('submit', event => {
      event.preventDefault();
      clearAlert();

      const loginValue = login.value.trim();
      const passwordValue = password.value;
      let firstInvalid = null;

      if (!loginValue) {
        showError(login, loginError, 'Введите логин');
        firstInvalid = firstInvalid || login;
      } else {
        showError(login, loginError, '');
      }

      if (!passwordValue) {
        showError(password, passwordError, 'Введите пароль');
        firstInvalid = firstInvalid || password;
      } else {
        showError(password, passwordError, '');
      }

      if (firstInvalid) {
        firstInvalid.focus();
        return;
      }

      setBusy(true);
    });

    requestAnimationFrame(() => document.documentElement.classList.add('is-ready'));
  </script>
</body>
</html>
